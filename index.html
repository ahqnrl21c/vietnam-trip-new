<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>하노이·사파·닌빈 가이드북</title>
<meta name="description" content="2026년 12월 17일부터 26일까지, 가족 여행 일정과 현지 안내">
<meta name="theme-color" content="#0F4A3C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="베트남 여행">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
<link rel="icon" type="image/png" href="./icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;800&display=swap">
<style>
:root{
  --forest:#0F4A3C;--forest-deep:#0A3229;--gold:#E3BC67;--gold-ink:#7D5E1E;
  --paper:#FBF8F0;--surface:#FFFEFA;--wash:#F1ECDF;--line:#E4DCCA;
  --ink:#1E2F2A;--muted:#5F6E67;--danger:#A63A2A;
  --hanoi:#B8432F;--sapa:#3F7596;--ninh:#3F8150;
  --serif:"Noto Serif KR","Noto Serif CJK KR",Georgia,serif;
  --sans:"Noto Sans KR","Noto Sans CJK KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
  --tabh:62px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:12px}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.65 var(--sans);word-break:keep-all;overflow-wrap:break-word}
body.locked{overflow:hidden}
h1,h2,h3,h4,p,ul,ol{margin:0;padding:0}
ul,ol{list-style:none}
a{color:inherit}
img{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:3px solid var(--gold-ink);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

/* Shell */
.shell{display:flex;min-height:100dvh}
.side{position:sticky;top:0;align-self:flex-start;height:100dvh;width:216px;flex:none;background:var(--forest-deep);color:#EEF3EC;padding:26px 14px;display:flex;flex-direction:column;gap:22px;overflow-y:auto}
.brand{font:800 19px/1.45 var(--serif);padding:0 10px;color:#FFF9E8}
.side-nav{display:grid;gap:2px}
.side-nav button{display:flex;align-items:center;gap:11px;width:100%;padding:10px;border-radius:9px;text-align:left;font-size:15px;font-weight:500;color:#DDE7E0}
.side-nav button:hover{background:#ffffff14}
.side-nav button[aria-current=page]{background:var(--gold);color:var(--forest-deep);font-weight:700}
.ico{width:21px;height:21px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{flex:1;min-width:0}
main:focus,main:focus-visible{outline:none}
.page{max-width:900px;margin:0 auto;padding:30px 28px 56px}
.tabs{display:none}

/* Headings */
.ptitle{font:800 28px/1.35 var(--serif);letter-spacing:-.5px;margin-bottom:6px;color:var(--forest-deep)}
.plead{color:var(--muted);margin-bottom:22px}
.sub{font:800 20px/1.4 var(--serif);color:var(--forest-deep);margin:32px 0 10px}
.sub:first-child{margin-top:0}
.back{display:none;align-items:center;gap:4px;min-height:40px;margin:-6px 0 4px;color:var(--forest);font-weight:700;font-size:15px}

/* Hero */
.hero{position:relative;display:grid;grid-template-columns:1fr minmax(0,52%);min-height:372px;background:var(--forest-deep);color:#FFF9E8;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;object-position:50% 45%;position:absolute;inset:0;grid-column:2}
.hero-photo{position:relative;grid-column:2;grid-row:1}
.hero-photo::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,var(--forest-deep),transparent 34%)}
.hero-text{grid-column:1;grid-row:1;align-self:center;padding:34px 12px 34px 44px;position:relative;z-index:2}
.hero-dates{font-size:15px;color:var(--gold);font-weight:700}
.hero h1{font:800 clamp(30px,3.7vw,44px)/1.3 var(--serif);letter-spacing:-1px;margin:12px 0 12px}
.hero-tag{color:#E5EBE3;font-size:15px}
.status{margin-top:22px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.status b{font:800 30px/1 var(--serif);color:var(--gold)}
.status span{font-size:14px;color:#E5EBE3}
.next{display:block;width:100%;text-align:left;background:var(--forest);color:#FFF9E8;padding:14px 44px}
.next small{display:block;font-size:13px;color:var(--gold);font-weight:700}
.next strong{font-weight:700}

/* Regions */
.regions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.region{position:relative;height:172px;border-radius:14px;overflow:hidden;background:var(--forest);color:#fff;text-align:left;display:block;width:100%}
.region img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.region::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#001e17c7,transparent 62%)}
.region span{position:absolute;z-index:1;left:14px;bottom:12px;right:8px;font:800 21px/1.25 var(--serif);text-shadow:0 1px 5px #0009}
.region small{display:block;font:500 13px/1.5 var(--sans)}
.region b{display:block;font-weight:800}

/* Rail: the trip as a train line */
.railwrap{margin:0 -4px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:4px 4px 2px}
.railwrap::-webkit-scrollbar{display:none}
.rail{display:flex;min-width:100%;width:max-content}
.stop{flex:1 0 76px;position:relative}
.stop::after{content:"";position:absolute;top:21px;left:50%;width:100%;border-top:3px solid var(--c);z-index:0}
.stop:last-child::after{display:none}
.stop.night::after{border-top-style:dotted;border-top-color:var(--forest-deep)}
.r-hanoi{--c:var(--hanoi)}.r-sapa{--c:var(--sapa)}.r-ninh{--c:var(--ninh)}
.stop button{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;width:100%;padding:12px 2px 6px;border-radius:10px;color:var(--ink)}
.stop i{width:20px;height:20px;border-radius:50%;background:var(--surface);border:4px solid var(--c);margin-bottom:6px;transition:transform .15s}
.stop b{font-size:15px;font-weight:700;line-height:1.3}
.stop small{font-size:13px;color:var(--muted);line-height:1.35}
.stop button[aria-current=true] i{background:var(--c);box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--c);transform:scale(1.05)}
.stop button[aria-current=true] b{color:var(--c)}
.stop.today small{color:var(--danger);font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:6px 0 16px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:18px;border-top:3px solid var(--c)}
.legend .n{border-top:3px dotted var(--forest-deep)}

/* Day */
.dayhead{position:relative;min-height:150px;border-radius:14px;overflow:hidden;color:#fff;display:flex;align-items:flex-end;background:var(--forest)}
.dayhead img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dayhead::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#04211bd1,#04211b66 62%,#04211b1f)}
.daytext{position:relative;z-index:1;padding:16px 18px}
.daytext small{font-size:14px;font-weight:500}
.daytext h3{font:800 25px/1.3 var(--serif);margin:2px 0}
.daytext p{font-size:15px}
.wx{display:inline-block;margin-top:6px;font-size:14px;font-weight:700;color:#FFE9B3}
.chips{display:flex;gap:7px;overflow-x:auto;padding:14px 2px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:6px 14px;border:1px solid var(--line);border-radius:19px;background:var(--surface);font-size:14px;font-weight:500;color:var(--ink)}
.chip[aria-pressed=true]{background:var(--forest);border-color:var(--forest);color:#fff;font-weight:700}
.events{margin-top:6px}
.ev{display:grid;grid-template-columns:70px minmax(0,1fr);gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev.is-next{background:linear-gradient(90deg,#E3BC6733,transparent);border-radius:8px}
.ev-time{font-size:15px;font-weight:700;color:var(--forest);line-height:1.4;padding-top:1px}
.ev-cat{font-size:13px;font-weight:700;color:var(--gold-ink)}
.ev h4{font-size:18px;font-weight:700;line-height:1.45;margin:1px 0 2px}
.ev p{color:var(--muted);font-size:15px}
.ev .tip{color:var(--ink);background:var(--wash);border-radius:7px;padding:7px 10px;margin-top:7px;font-size:14px;line-height:1.55}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.act{display:inline-flex;align-items:center;min-height:38px;padding:5px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--forest);font-size:14px;font-weight:700;text-decoration:none}
.act:hover{background:var(--wash)}
.act.solid{background:var(--forest);border-color:var(--forest);color:#fff}
.act.quiet{color:var(--muted);font-weight:500}
.act.danger{color:var(--danger)}
.add{display:block;width:100%;min-height:50px;margin-top:14px;border:1.5px dashed #B2A988;border-radius:10px;color:var(--forest);font-weight:700}
.empty{padding:18px;background:var(--wash);border-radius:10px;color:var(--muted);margin-top:12px}
.note{padding:12px 14px;background:var(--wash);border-radius:10px;font-size:15px;margin:14px 0}
.note b{color:var(--forest-deep)}
.morelink{display:inline-flex;align-items:center;min-height:42px;font-weight:700;color:var(--forest)}

/* Lists */
.rows{border-top:1px solid var(--line)}
.row{padding:14px 0;border-bottom:1px solid var(--line)}
.row small{font-size:13px;font-weight:700;color:var(--gold-ink)}
.row h3{font-size:18px;font-weight:700;line-height:1.45}
.row p{color:var(--muted);font-size:15px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;margin:8px 0}
.kv dt{font-weight:700}.kv dd{margin:0;color:var(--muted)}
dl{margin:0}

/* More hub */
.hub{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hub button{display:flex;align-items:center;gap:11px;min-height:64px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;font-weight:700;color:var(--forest-deep)}

/* Checklist */
.progress{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:15px;font-weight:700}
.bar{flex:1;height:8px;border-radius:4px;background:var(--wash);overflow:hidden}
.bar i{display:block;height:100%;background:var(--forest)}
.check{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);min-height:50px}
.check label{display:flex;align-items:center;gap:11px;flex:1;min-width:0;padding:10px 0}
.check input{width:22px;height:22px;flex:none;accent-color:var(--forest);margin:0}
.check input:checked+span{color:var(--muted);text-decoration:line-through}
.xbtn{flex:none;width:40px;height:40px;color:var(--muted);font-size:20px;border-radius:8px}
.inline{display:flex;gap:8px;margin-top:14px}
.inline input{flex:1;min-width:0}
input[type=text],input[type=number],input:not([type]),select,textarea{width:100%;min-height:46px;padding:9px 11px;border:1px solid #CFC6B1;border-radius:9px;background:var(--surface);font-size:16px}
textarea{resize:vertical;line-height:1.6}
.memo{min-height:50dvh}
.field{display:block;font-size:14px;font-weight:700;margin-top:12px}
.field>*{margin-top:4px;font-weight:400}
.err{color:var(--danger);font-size:14px;min-height:21px;margin-top:4px}
.btn{min-height:46px;padding:8px 18px;border-radius:9px;background:var(--forest);color:#fff;font-weight:700}
.btn.alt{background:var(--wash);color:var(--forest-deep)}
.btn.danger{background:none;color:var(--danger);padding:8px 10px;margin-right:auto}

/* Money */
.calc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.total{font:800 26px/1.3 var(--serif);color:var(--forest-deep)}
.exp{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.exp b{display:block;font-weight:500}
.exp small{color:var(--muted);font-size:13px}
.exp span{text-align:right;font-weight:700;white-space:nowrap}
.exp span small{display:block;font-weight:400}
.form3{display:grid;grid-template-columns:96px minmax(0,1fr) 124px;gap:8px;margin-top:12px}

/* Info */
.tel{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);text-decoration:none}
.tel b{font-weight:700;display:block}
.tel small{font-size:13px;color:var(--muted)}
.tel span{color:var(--forest);font-weight:700;white-space:nowrap}
.wxgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.wxgrid div{padding:12px;background:var(--wash);border-radius:10px}
.wxgrid b{display:block}
.src{font-size:13px;color:var(--muted);margin-top:8px}
.bullets li{padding:8px 0 8px 16px;position:relative;border-bottom:1px solid var(--line)}
.bullets li::before{content:"";position:absolute;left:2px;top:19px;width:6px;height:6px;border-radius:50%;background:var(--gold-ink)}
.phrase{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:11px 0;border-bottom:1px solid var(--line)}
.phrase b{display:block;font-weight:700}
.phrase small{font-size:14px;color:var(--muted)}

/* Dialogs */
dialog{border:0;padding:0;background:var(--paper);color:var(--ink);width:100%;max-width:620px;max-height:90dvh;border-radius:16px;margin:auto}
dialog::backdrop{background:#05201ab8}
.sheet{padding:22px 22px max(20px,env(safe-area-inset-bottom));overflow:auto;max-height:90dvh}
.sheet h3{font:800 23px/1.35 var(--serif);color:var(--forest-deep);margin-bottom:4px}
.sheet .lead{color:var(--muted);margin-bottom:6px}
.body h4{font-size:16px;font-weight:700;color:var(--forest);margin:18px 0 4px}
.body p{white-space:pre-line;line-height:1.8}
.foot{position:sticky;bottom:calc(-1*max(20px,env(safe-area-inset-bottom)));display:flex;gap:8px;justify-content:flex-end;background:var(--paper);padding:12px 0 max(4px,env(safe-area-inset-bottom));margin-top:12px}
.big{text-align:center;padding:20px 0}
.big strong{display:block;font:700 clamp(30px,9vw,44px)/1.35 var(--sans);color:var(--forest-deep)}
.big p{color:var(--muted);margin-top:10px}

.toast{position:fixed;z-index:30;left:50%;bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom));transform:translateX(-50%);display:none;align-items:center;gap:12px;background:var(--forest-deep);color:#fff;padding:10px 16px;border-radius:10px;max-width:calc(100vw - 32px);font-size:15px;box-shadow:0 4px 18px #0005}
.toast.on{display:flex}
.toast button{color:var(--gold);font-weight:700;min-height:32px;white-space:nowrap}

@media(min-width:861px){.toast{bottom:24px}.dayhead img{left:auto;right:0;width:60%}.dayhead::after{background:linear-gradient(90deg,var(--forest-deep) 40%,#0a322966 62%,transparent 80%)}}
@media(max-width:860px){
  .side{display:none}
  main{padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom))}
  .page{padding:20px 16px 28px}
  .back{display:inline-flex}
  .tabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));position:fixed;z-index:20;left:0;right:0;bottom:0;height:calc(var(--tabh) + env(safe-area-inset-bottom));padding:0 4px env(safe-area-inset-bottom);background:var(--forest-deep)}
  .tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#D5E0D9;font-size:12px;font-weight:500}
  .tabs button[aria-current=page]{color:var(--gold);font-weight:700}
  .hero{display:block;min-height:0;height:min(112vw,460px)}
  .hero-photo{position:absolute;inset:0}
  .hero-photo::before{background:linear-gradient(0deg,#051f19ed 12%,#051f1973 56%,#051f1933)}
  .hero img{object-position:50% 40%}
  .hero-text{position:absolute;left:0;right:0;bottom:0;padding:20px 18px}
  .hero h1{font-size:clamp(28px,8vw,36px);margin:6px 0 6px}
  .status{margin-top:12px}
  .next{padding:12px 18px}
  .region{height:clamp(116px,31vw,160px);border-radius:12px}
  .region span{left:10px;bottom:9px;font-size:17px}
  .region small{font-size:12px}
  .regions{gap:8px}
  .form3{grid-template-columns:1fr 1fr}.form3 .full{grid-column:1/-1}
  dialog{margin:auto 0 0;max-width:none;width:100%;border-radius:16px 16px 0 0}
  .ev{grid-template-columns:62px minmax(0,1fr);gap:10px}
}
@media(max-width:380px){.ptitle{font-size:25px}.region span{font-size:15px}.hub{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media print{.side,.tabs,.acts,.add,.chips,.toast{display:none!important}.page{max-width:none}}

/* Integrated premium mobile layout · 2026-11-05 */
:root{--forest-deep:#103e33;--gold:#e3c88d}
html,body{max-width:100%;overflow-x:hidden}
.shell,.page,main{min-width:0;max-width:100%}
.tabs{grid-template-columns:repeat(6,minmax(0,1fr))!important;width:100%;max-width:100vw;box-sizing:border-box;padding-left:max(3px,env(safe-area-inset-left));padding-right:max(3px,env(safe-area-inset-right));box-shadow:0 -4px 18px #102e2526}
.tabs button{min-width:0;width:100%;padding:6px 1px;white-space:nowrap;font-size:clamp(10px,2.75vw,12px);line-height:1.25;overflow:hidden}
.tabs .ico{width:21px;height:21px;flex:none}
.regions{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.region{min-width:0;overflow:hidden}
.hero h1{text-wrap:balance}
@media(max-width:600px){.tabs{height:calc(66px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)}.shell{padding-bottom:calc(74px + env(safe-area-inset-bottom))}.page{padding-bottom:calc(90px + env(safe-area-inset-bottom))}}
</style>
</head>
<body>
<div class="shell">
  <nav class="side" aria-label="주 메뉴"><div class="brand">하노이 · 사파<br>닌빈 가이드북</div><div class="side-nav" id="sideNav"></div></nav>
  <main id="main" tabindex="-1"></main>
  <nav class="tabs" aria-label="하단 메뉴" id="tabs"></nav>
</div>
<dialog id="guideDlg" aria-labelledby="gT"><div class="sheet"><h3 id="gT"></h3><p class="lead" id="gS"></p><div class="body" id="gB"></div><div class="foot"><button class="btn alt" data-act="closeDlg">닫기</button><a class="btn" id="gM" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;text-decoration:none">지도 열기</a></div></div></dialog>
<dialog id="editDlg" aria-labelledby="eT"><form class="sheet" id="editForm" novalidate><h3 id="eT"></h3>
  <label class="field">날짜<select id="fDay"></select></label>
  <label class="field">종류<select id="fCat"><option value="spot">관광</option><option value="food">식사</option><option value="hotel">숙소</option><option value="move">교통</option></select></label>
  <label class="field">시간<input id="fTime" placeholder="14:00 또는 오후" autocomplete="off"></label>
  <label class="field">장소 이름<input id="fName" autocomplete="off"></label>
  <label class="field">메모<textarea id="fNote" rows="3"></textarea></label>
  <label class="field">지도 검색어<input id="fMap" placeholder="Google 지도에서 찾을 이름" autocomplete="off"></label>
  <p class="err" id="fErr" role="alert"></p>
  <div class="foot"><button type="button" class="btn danger" id="fDel" data-act="delEvent">삭제</button><button type="button" class="btn alt" data-act="closeDlg">취소</button><button class="btn" type="submit">저장</button></div>
</form></dialog>
<dialog id="phraseDlg" aria-labelledby="pV"><div class="sheet"><div class="big"><strong id="pV" lang="vi"></strong><p id="pK"></p></div><div class="foot"><button class="btn alt" data-act="closeDlg">닫기</button></div></div></dialog>
<input type="file" id="regionFile" accept="image/*" hidden>
<input type="file" id="restoreFile" accept="application/json,.json" hidden>

{id:'literature',name:'하노이 문묘 · 국자감',match:['문묘','국자감','Temple of Literature'],short:'문묘',subtitle:'1070년 건립 · 베트남 유교와 교육의 상징',map:'Temple of Literature Hanoi',body:'■ 역사 이야기\n1070년 리 왕조의 리 타인 똥 황제가 공자를 기리기 위해 세운 사당입니다. 1076년에는 왕실과 관료 교육을 위한 국자감이 설치되어 베트남의 오랜 학문 전통을 상징하게 되었습니다.\n\n■ 꼭 볼 곳\n① 규문각(Khuê Văn Các): 하노이의 상징적인 누각입니다.\n② 진사비: 과거시험 합격자의 이름을 새긴 석비가 거북 받침 위에 놓여 있습니다.\n③ 대성전: 공자와 유교 성현을 모신 공간입니다.\n\n■ 현장 관람 팁\n약 60~90분을 잡고, 정원과 전각을 차례로 걸어보세요. 08:00~17:00 개방, 성인 7만 동, 15세 미만 무료 안내가 있습니다. 조용한 분위기의 유적지이므로 단정한 복장을 추천합니다.'},
{id:'hoalu',name:'호아루 고도',match:['호아루','호아르','Hoa Lu'],short:'호아루',subtitle:'10~11세기 · 딘 왕조와 전 레 왕조의 옛 수도',map:'Hoa Lu Ancient Capital Ninh Binh',body:'■ 역사 이야기\n호아루는 968년 딘보린이 나라를 통일하고 수도로 삼은 곳입니다. 이후 전 레 왕조 시기에도 수도였으며, 1010년 리 왕조가 탕롱(현재 하노이)으로 천도하기 전까지 중요한 정치 중심지였습니다.\n\n■ 꼭 볼 곳\n딘띠엔호앙 사원과 레다이하인 사원을 둘러보세요. 석회암 산으로 둘러싸인 지형이 자연 방어선 역할을 했다는 점이 흥미롭습니다.\n\n■ 현장 관람 팁\n약 45~75분. 전각의 목조 조각과 돌 장식을 천천히 관찰하세요.'},
{id:'bichdong',name:'빅동 사원',match:['빅동','Bich Dong','Bích Động'],short:'빅동 사원',subtitle:'산과 동굴에 걸쳐 세워진 닌빈의 불교 사원',map:'Bich Dong Pagoda Ninh Binh',body:'■ 역사 이야기\n1428년 산 정상에 작은 절이 처음 세워졌고, 1705년 두 승려가 이를 고쳐 하·중·상 세 사원으로 다시 지었습니다. 빅동(푸른 동굴)이라는 이름은 1774년 찐썸 군주가 붙였습니다.\n\n■ 꼭 볼 곳\n연못 앞 돌다리와 삼관문은 대표적인 사진 명소입니다. 아래·중간·위 사원으로 이어지는 계단을 오르면 동굴과 산의 풍경이 펼쳐집니다.\n\n■ 현장 관람 팁\n약 45~60분. 계단이 미끄러울 수 있어 편한 신발이 좋습니다. 사찰 예절을 지켜주세요.'},
{id:'cathedral',name:'하노이 성요셉 성당',match:['성요셉','St Joseph','St. Joseph'],short:'성요셉 성당',subtitle:'1886년 완공 · 하노이의 대표적인 네오고딕 성당',map:'St Joseph Cathedral Hanoi',body:'■ 역사 이야기\n19세기 프랑스 식민지 시기에 건립된 가톨릭 성당입니다. 1886년에 완공되었으며, 두 개의 종탑과 뾰족한 아치가 특징인 네오고딕 양식을 보여줍니다.\n\n■ 꼭 볼 곳\n성당 정면의 쌍탑과 광장을 보세요. 성탄절 무렵에는 주변 거리의 장식과 분위기도 즐길 수 있습니다.\n\n■ 현장 관람 팁\n외관 관람 약 15~30분. 미사 중에는 조용히 하고 내부 출입 가능 시간은 현장에서 확인하세요.'},
{id:'ngocson',name:'응옥선 사당 · 호안끼엠 호수',match:['응옥선','호안끼엠','Ngoc Son','Hoan Kiem'],short:'호안끼엠',subtitle:'호수 속 작은 섬에 자리한 하노이의 상징',map:'Ngoc Son Temple Hanoi',body:'■ 역사 이야기\n응옥선 사당은 호안끼엠 호수의 작은 섬에 위치합니다. 붉은색 훅 다리(Thê Húc Bridge)를 건너 들어가며, 문학과 무예의 인물들을 기리는 공간입니다. 호안끼엠은 레러이 왕이 신성한 검을 거북에게 돌려주었다는 전설로 유명합니다.\n\n■ 꼭 볼 곳\n붉은 훅 다리, 호수 풍경, 사당 내부의 전시물을 둘러보세요.\n\n■ 현장 관람 팁\n약 30~45분. 이른 아침이나 해질 무렵 산책과 함께 방문하면 좋습니다.'},
{id:'stonechurch',name:'사파 석조 성당',match:['석조 성당','석조성당','Stone Church'],short:'석조 성당',subtitle:'1895년 건립 · 사파 중심 광장의 프랑스 시대 건축',map:'Sapa Stone Church',body:'■ 역사 이야기\n사파 석조 성당은 1895년 프랑스인이 세운 석조 교회로, 사파 중심부의 대표적인 랜드마크입니다. 주변 산악 지역의 역사와 사파의 도시 형성을 떠올리며 볼 수 있습니다.\n\n■ 꼭 볼 곳\n돌로 쌓은 외벽과 종탑, 성당 앞 광장. 주변의 선플라자와 함께 도보로 둘러보기 좋습니다.\n\n■ 현장 관람 팁\n약 15~25분. 저녁에는 광장과 주변 거리의 분위기가 좋습니다.'},
{id:'badi',name:'바딘 광장 · 호찌민 관련 유적',match:['바딘','Ba Dinh','호찌민 묘'],short:'바딘 광장',subtitle:'1945년 독립선언이 이루어진 역사적 장소',map:'Ba Dinh Square Hanoi',body:'■ 역사 이야기\n1945년 9월 2일 호찌민이 베트남 민주공화국 독립선언문을 발표한 장소입니다. 현재 광장 주변에는 호찌민 묘소와 여러 국가적 기념 시설이 자리합니다.\n\n■ 꼭 볼 곳\n넓은 광장과 호찌민 묘소 외관, 주변 역사 건축물을 함께 보세요.\n\n■ 현장 관람 팁\n광장 산책은 20~40분입니다. 호찌민 묘소는 월·금 휴관, 오전만 개방, 무료입니다. 겨울철(11~3월) 입장은 08:00~11:00이며 끝나기 전에 입장을 마감할 수 있습니다. 어깨와 무릎을 가리는 복장을 입으세요. 매년 가을 보존 작업으로 쉬며, 2026년 휴관은 11월 2일까지였습니다.'}

{id:'catcat',name:'깟깟마을',short:'깟깟마을',match:['깟깟','Cat Cat'],subtitle:'사파 시내에서 약 2km · 검은 몽족 마을',map:'Cat Cat Village Sapa',body:'■ 이야기\n검은 몽(H’Mông)족이 벼와 옥수수를 기르고 쪽물 들인 천을 짜며 살아가는 마을입니다.\n\n■ 꼭 볼 곳\n마을 길을 따라 이어지는 전통 가옥과 직물 공방을 둘러보세요.\n\n■ 현장 관람 팁\n입장료는 성인 약 15만 동으로 안내됩니다. 내리막 25~35분, 오르막 30~50분이며 가파른 돌계단이 많습니다. 돌아올 때는 택시나 오토바이를 이용할 수 있습니다.'},
{id:'trangan',name:'짱안 경관 단지',short:'짱안',match:['짱안','Tràng An','Trang An'],subtitle:'2014년 등재 · 베트남 최초의 세계복합유산',map:'Trang An Scenic Landscape Complex',body:'■ 이야기\n석회암 봉우리와 물길이 이어진 경관으로, 2014년 유네스코 세계복합유산이 되었습니다. 이 산과 물길은 10세기 수도 호아루의 천연 요새 역할을 했습니다.\n\n■ 꼭 볼 곳\n나룻배를 타고 낮은 동굴을 지나며 사원에 들릅니다. 2코스는 동굴 4곳과 영적 장소 3곳을 지납니다.\n\n■ 현장 관람 팁\n2024년 안내 기준 어른 25만 동, 1~1.3m 어린이 12만 동이고 1코스는 3~4시간, 2코스는 2~3시간입니다. 겨울에는 07:00~16:30 운영합니다. 요금은 현장에서 확인하세요.'},
{id:'hangmua',name:'항무아 전망대',short:'항무아',match:['항무아','Hang Mua'],subtitle:'약 500계단 위에서 보는 땀꼭 풍경',map:'Hang Mua Viewpoint',body:'■ 이야기\n석회암 산을 따라 약 500개의 돌계단이 이어지고, 정상에는 용 조각상이 있습니다.\n\n■ 꼭 볼 곳\n꼭대기에서 땀꼭의 강과 들판, 봉우리를 내려다보세요.\n\n■ 현장 관람 팁\n계단이 가파르니 미끄럽지 않은 신발을 신고 천천히 오르세요.'},
{id:'dongxuan',name:'동쑤언 시장',short:'동쑤언 시장',match:['동쑤언','Dong Xuan'],subtitle:'1889년 시작 · 하노이 올드쿼터의 대표 시장',map:'Dong Xuan Market Hanoi',body:'■ 이야기\n1889년 프랑스 식민 당국이 지은 시장에서 출발했습니다. 1994년 화재로 대부분 불탄 뒤 지금의 콘크리트 건물로 다시 지어졌습니다.\n\n■ 꼭 볼 곳\n1층은 원단과 잡화, 2층은 의류, 3층은 생활용품과 공예품이 많습니다.\n\n■ 현장 관람 팁\n대략 06:00~18:00 영업하며 점포마다 다릅니다. 금요일 저녁부터 주말에는 항다오 거리에 야시장이 열립니다.'},
{id:'puppet',name:'탕롱 수상인형극',short:'수상인형극',match:['수상인형','Water Puppet'],subtitle:'11세기 무렵 홍강 삼각주에서 시작된 공연',map:'Thang Long Water Puppet Theatre',body:'■ 이야기\n11세기 무렵 홍강 삼각주의 물 찬 논에서 시작되었습니다. 인형을 부리는 사람이 대나무 발 뒤에 숨어 물속 장대로 나무 인형을 움직입니다. 탕롱 극장은 1969년에 문을 열었습니다.\n\n■ 현장 관람 팁\n월~토 16:10, 17:20, 18:30, 20:00 공연 안내가 있으며 약 50분입니다. 표는 10만~20만 동으로 안내됩니다. 앞자리는 물이 튈 수 있습니다. 극장은 호안끼엠 호수에서 약 200m 거리입니다.'}
];
const GUIDE_REGION={literature:'hanoi',hoalu:'ninh',bichdong:'ninh',cathedral:'hanoi',ngocson:'hanoi',stonechurch:'sapa',badi:'hanoi',fansipan:'sapa',catcat:'sapa',trangan:'ninh',hangmua:'ninh',dongxuan:'hanoi',puppet:'hanoi'};

<script>
"use strict";
/* ---------- Trip constants ---------- */
const TZ='Asia/Ho_Chi_Minh',START='2026-12-17',CHECKED='2026년 11월 5일';
const REGION_NAME={hanoi:'하노이',sapa:'사파',ninh:'닌빈'},REGION_EN={hanoi:'Hanoi',sapa:'Sa Pa',ninh:'Ninh Binh'};
const REGION_FIRST_DAY={hanoi:0,sapa:1,ninh:5};
const COORD={hanoi:[21.03,105.85],sapa:[22.34,103.84],ninh:[20.25,105.97]};
const NIGHT_AFTER=[0,4]; // 12/17, 12/21 sleeper trains
const CAT={spot:'관광',food:'식사',hotel:'숙소',move:'교통'};
const regionOf=d=>d>=5&&d<=6?'ninh':d>=1&&d<=4?'sapa':'hanoi';

/* Site-checked notes attached to built-in events by id, so they survive saved edits. */
const TIPS={
 base5:'라오까이행 열차는 본역 뒤쪽 B역(Trần Quý Cáp 거리)에서 타는 경우가 있습니다. 승차 위치는 예약증으로 확인하세요.',
 base10:'지난해 12월 18일 정상에 눈이 내렸고 기온은 1~2℃였습니다. 시내보다 훨씬 춥게 준비하세요.',
 base23:'겨울철 운영 시간은 07:00~16:30 안내가 있습니다(2024년 자료). 2코스 소요 시간은 2~3시간입니다.',
 base34:'이날은 목요일이라 호찌민 묘소 입장이 가능합니다. 겨울철 08:00~11:00, 무료이며 어깨와 무릎을 가려야 합니다. 묘소를 먼저 가세요.',
 base36:'공연 시간은 16:10, 17:20, 18:30, 20:00 안내가 있으며 약 50분입니다. 당일 다시 확인하세요.',
 base39:'금요일 저녁에는 항다오 거리에서 주말 야시장이 열립니다.'
};
const CHECK_NEW=['사전입국정보(PAI) 제출: 입국 72시간 이내','건강신고서 제출 여부 확인','14세 미만 자녀 동반 시 영문 가족관계증명서','전자담배는 가져가지 않기'];
const CHECK_DEFAULT=['여권 및 항공권 확인','호텔 예약 확인서 저장','야간열차 예약증 확인','베트남 동 환전 및 카드 준비','해외 여행자보험','휴대폰 충전기 · 보조배터리','사파 방한복 · 편한 신발','상비약 · 개인 위생용품'];
const PHRASES=[
 ['연어와 송어는 먹지 않습니다.','Tôi không ăn cá hồi.'],
 ['염소고기는 먹지 않습니다.','Tôi không ăn thịt dê.'],
 ['맵지 않게 해주세요.','Không cay.'],
 ['얼마예요?','Bao nhiêu tiền?'],
 ['계산해 주세요.','Tính tiền.'],
 ['화장실이 어디예요?','Nhà vệ sinh ở đâu?'],
 ['이 주소로 가주세요.','Cho tôi đến địa chỉ này.'],
 ['병원으로 가주세요.','Cho tôi đến bệnh viện.'],
 ['감사합니다.','Cảm ơn.']
];

/* ---------- Storage (same keys as the previous version) ---------- */
const KEY={events:'vn-trip-2026-v2',regions:'vn-2026-region-images',checks:'vn-2026-checklist',memo:'vn-2026-memo',exp:'vn-2026-expenses',rate:'vn-2026-rate',wx:'vn-2026-weather',checkMig:'vn-2026-check-v2'};
const toastEl=document.getElementById('toast');let toastT;
function toast(msg,undo){toastEl.textContent=msg;if(undo){const b=document.createElement('button');b.textContent='되돌리기';b.onclick=()=>{toastEl.classList.remove('on');undo()};toastEl.append(b)}toastEl.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('on'),undo?7000:3000)}
const store={
 raw(k){try{return localStorage.getItem(k)}catch(e){return null}},
 get(k,d){const v=this.raw(k);if(v==null)return d;try{return JSON.parse(v)}catch(e){return d}},
 setRaw(k,v){try{localStorage.setItem(k,v);return true}catch(e){toast('이 기기에 저장하지 못했습니다. 설정에서 백업한 뒤 사진을 줄여 주세요.');return false}},
 set(k,v){return this.setRaw(k,JSON.stringify(v))}
};
function normEvent(x,i){
 const day=Math.min(9,Math.max(0,parseInt(x.day,10)||0));
 let name=String(x.name??'').trim();if(name==='호아르 고도')name='호아루 고도';
 return{id:String(x.id||('custom'+Date.now()+'-'+i)),day,cat:CAT[x.cat]?x.cat:'spot',time:String(x.time??''),name,note:String(x.note??''),map:String(x.map??'')};
}
const validEvents=a=>Array.isArray(a)&&a.every(x=>x&&typeof x.name==='string'&&x.name.trim());
const cleanRegions=o=>Object.fromEntries(Object.entries(o||{}).filter(([k,v])=>REGION_NAME[k]&&/^data:image\/(jpeg|png|webp);base64,/.test(v)));
const cleanChecks=a=>a.filter(c=>c&&typeof c.t==='string').map(c=>({t:c.t,done:!!c.done}));

let events=(()=>{const v=store.get(KEY.events,null);return (validEvents(v)?v:defaults).map(normEvent)})();
let regions=cleanRegions(store.get(KEY.regions,{}));
let checks=(()=>{const v=store.get(KEY.checks,null);return Array.isArray(v)?cleanChecks(v):CHECK_DEFAULT.map(t=>({t,done:false}))})();
if(!store.raw(KEY.checkMig)){CHECK_NEW.forEach(t=>{if(!checks.some(c=>c.t===t))checks.unshift({t,done:false})});store.set(KEY.checks,checks);store.setRaw(KEY.checkMig,'1')}
let memo=store.raw(KEY.memo)||'';
let expenses=store.get(KEY.exp,[]);if(!Array.isArray(expenses))expenses=[];
let rate=store.get(KEY.rate,{v:18,src:'참고값(2026년 1월 환율 기준)'});

/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mapLink=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
const photoOf=k=>regions[k]||IMG[k];
const fmt=n=>Math.round(n).toLocaleString('ko-KR');
const dayLabel=d=>`${dates[d][0]} ${dates[d][1]}`;
function rankOf(t){
 const m=/(\d{1,2}):(\d{2})/.exec(t);if(m)return +m[1]*60+ +m[2];
 for(const[w,r]of[['오전',540],['낮',720],['점심',720],['오후',840],['저녁',1080],['밤',1290]])if(t.startsWith(w))return r;
 return null;
}
function dayEvents(d){
 let last=-1;
 return events.filter(x=>x.day===d).map((x,i)=>{const r=rankOf(x.time);if(r!=null)last=r;return{x,r:r??last,i}}).sort((a,b)=>a.r-b.r||a.i-b.i).map(o=>o.x);
}
function guidesFor(x){if(x.cat!=='spot')return[];const n=x.name.toLowerCase();return guides.filter(g=>g.match.some(k=>n.includes(k.toLowerCase())))}
function nowVN(){
 const p=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).map(x=>[x.type,x.value]));
 return{date:`${p.year}-${p.month}-${p.day}`,mins:+p.hour*60+ +p.minute};
}
function tripState(){
 const n=nowVN(),diff=Math.round((Date.parse(n.date)-Date.parse(START))/864e5);
 if(diff<0)return{phase:'before',left:-diff};
 if(diff>9)return{phase:'after'};
 return{phase:'during',day:diff,mins:n.mins};
}
function nextEvent(){const t=tripState();if(t.phase!=='during')return null;const a=dayEvents(t.day);let r=-1;for(const x of a){const q=rankOf(x.time);if(q!=null)r=q;if(r>=t.mins)return{x,day:t.day}}return null}

/* ---------- State + routing ---------- */
const NAV=[['home','홈','M3 11l9-8 9 8M5 10v10h14V10'],['schedule','여행 일정','M4 6h16v14H4zM4 10h16M9 3v4M15 3v4'],['places','방문 명소','M12 21s7-6.2 7-11a7 7 0 10-14 0c0 4.8 7 11 7 11zM12 12.5a2.5 2.5 0 100-5 2.5 2.5 0 000 5z'],['food','맛집','M7 3v8M4 3v5a3 3 0 006 0V3M7 11v10M17 3c-2 1-3 4-3 7 0 2 1 3 3 3v8'],['stay','숙소·교통','M3 19V8M3 15h18v4M21 15v-3a3 3 0 00-3-3h-7v6M7 12.5a1.5 1.5 0 100-3 1.5 1.5 0 000 3z'],['map','장소 지도','M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14'],['info','여행 정보','M12 21a9 9 0 100-18 9 9 0 000 18zM12 11v5M12 8h.01'],['check','체크리스트','M4 12l5 5L20 6'],['money','환율·경비','M12 3v18M16.5 7H10a3 3 0 000 6h4a3 3 0 010 6H7'],['memo','메모','M5 4h14v16H5zM9 9h6M9 13h6'],['photos','내 사진','M4 5h16v14H4zM8.5 11a1.5 1.5 0 100-3 1.5 1.5 0 000 3zM20 16l-5-5L6 19'],['settings','백업','M12 3v12M7 10l5 5 5-5M4 20h16']];
const TABS=['home','schedule','places','stay','food','map'];
const icon=d=>`<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="${d}"/></svg>`;
const navOf=p=>NAV.find(n=>n[0]===p);
const S={page:'home',day:0,cat:'all',foodDay:'all',foodRegion:'all',placeRegion:'all',mapCat:'spot',addDraft:'',pendingRegion:'hanoi',editing:null};
{const t=tripState();if(t.phase==='during')S.day=t.day}

function go(page,opts={}){if(location.hash.slice(1)!==page&&!opts.silent){location.hash=page;return}S.page=VIEWS[page]?page:'home';render();if(!opts.keep){window.scrollTo(0,0);$('#main').focus({preventScroll:true})}}
addEventListener('hashchange',()=>go(location.hash.slice(1)||'home',{silent:true}));
function drawNav(){
 const act=S.page;
 $('#sideNav').innerHTML=NAV.map(([p,l,d])=>`<button data-act="go" data-p="${p}" ${p===act?'aria-current="page"':''}>${icon(d)}${l}</button>`).join('');
 const inTabs=TABS.includes(act)?act:'';
 $('#tabs').innerHTML=TABS.map(p=>{const[l,d]=p==='more'?['더보기','M4 6h16M4 12h16M4 18h16']:[({home:'홈',schedule:'일정',places:'명소',stay:'숙소',food:'맛집',map:'지도'})[p],navOf(p)[2]];return `<button data-act="go" data-p="${p}" ${p===inTabs?'aria-current="page"':''}>${icon(d)}${l}</button>`}).join('');
}
function render(){drawNav();$('#main').innerHTML=VIEWS[S.page]();document.title=(S.page==='home'?'':(navOf(S.page)?.[1]||'더보기')+' | ')+'하노이·사파·닌빈 가이드북';scrollRail()}
function scrollRail(){const on=$('.stop button[aria-current=true]');if(on)on.parentElement.parentElement.parentElement.scrollLeft=on.parentElement.offsetLeft-Math.max(0,(on.parentElement.parentElement.parentElement.clientWidth-on.parentElement.offsetWidth)/2)}
const pageHead=(t,lead='')=>`<button class="back" data-act="go" data-p="more">‹ 더보기</button><h1 class="ptitle">${t}</h1>${lead?`<p class="plead">${lead}</p>`:''}`;

/* ---------- Schedule ---------- */
function railHTML(){
 const t=tripState(),today=t.phase==='during'?t.day:-1;
 return `<div class="railwrap" tabindex="-1"><ol class="rail">${dates.map((d,i)=>`<li class="stop r-${regionOf(i)} ${NIGHT_AFTER.includes(i)?'night':''} ${i===today?'today':''}"><button data-act="day" data-i="${i}" aria-current="${S.day===i}" aria-label="${d[0]} ${d[1]}요일 ${esc(d[2])}"><i></i><b>${d[0]}</b><small>${i===today?'오늘':d[1]}</small></button></li>`).join('')}</ol></div>
 <div class="legend r-hanoi"><span><i></i>하노이</span><span class="r-sapa"><i></i>사파</span><span class="r-ninh"><i></i>닌빈</span><span><i class="n"></i>야간열차</span></div>`;
}
function eventHTML(x,next){
 const gs=guidesFor(x),tip=TIPS[x.id];
 return `<article class="ev ${next?'is-next':''}"><div class="ev-time">${esc(x.time||'시간 미정')}</div><div><span class="ev-cat">${CAT[x.cat]}</span><h4>${esc(x.name)}</h4>${x.note?`<p>${esc(x.note)}</p>`:''}${tip?`<p class="tip">${esc(tip)}</p>`:''}<div class="acts">${gs.map(g=>`<button class="act solid" data-act="guide" data-id="${g.id}">${esc(g.short||g.name)} 해설</button>`).join('')}${x.map?`<a class="act" href="${mapLink(x.map)}" target="_blank" rel="noopener">지도</a>`:''}<button class="act quiet" data-act="edit" data-id="${esc(x.id)}">수정</button></div></div></article>`;
}
function dayHTML(full){
 const d=dates[S.day],k=regionOf(S.day),all=dayEvents(S.day);
 const list=full&&S.cat!=='all'?all.filter(x=>x.cat===S.cat):all;
 const nx=nextEvent();const w=wxFor(S.day);
 const chips=[['all','전체'],...Object.entries(CAT)].map(([c,n])=>`<button class="chip" data-act="cat" data-c="${c}" aria-pressed="${S.cat===c}">${n}</button>`).join('');

const WMO=c=>c===0?'맑음':c<=2?'구름 조금':c===3?'흐림':c<=48?'안개':c<=57?'이슬비':c<=67?'비':c<=77?'눈':c<=82?'소나기':c<=86?'눈':'뇌우';
let wx=store.get(KEY.wx,null);
function wxFor(d){const r=wx?.data?.[regionOf(d)];if(!r)return'';const iso=`2026-12-${17+d}`,i=r.time.indexOf(iso);if(i<0)return'';return `${WMO(r.weather_code[i])} ${Math.round(r.temperature_2m_min[i])}~${Math.round(r.temperature_2m_max[i])}℃, 강수 ${r.precipitation_probability_max[i]??0}%`}
function wxHTML(){
 const days=dates.map((_,i)=>[i,wxFor(i)]).filter(x=>x[1]);

async function refreshWx(){
 const t=tripState();if(t.phase==='after'||(t.phase==='before'&&t.left>15))return;
 if(wx?.at&&Date.now()-wx.at<3*36e5)return;
 try{
  const data={};
  for(const k of Object.keys(COORD)){const[la,lo]=COORD[k];const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FBangkok&forecast_days=16`);if(!r.ok)throw 0;data[k]=(await r.json()).daily}
  wx={at:Date.now(),data};store.set(KEY.wx,wx);if(['home','schedule','info'].includes(S.page))render();
 }catch(e){/* keep cached forecast; the climate note still shows */}
}

function pickRegionFile(file){
 if(!file)return;const url=URL.createObjectURL(file),img=new Image();
 img.onload=()=>{const c=document.createElement('canvas'),r=Math.min(1,1200/Math.max(img.width,img.height));c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);const k=S.pendingRegion,prev=regions[k];regions[k]=c.toDataURL('image/jpeg',.78);if(store.set(KEY.regions,regions)){render();toast(`${REGION_NAME[k]} 사진을 변경했습니다.`)}else{if(prev)regions[k]=prev;else delete regions[k]}};
 img.onerror=()=>{URL.revokeObjectURL(url);toast('이 파일은 사진으로 열 수 없습니다.')};img.src=url;
}
function download(obj,name){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function restore(file){
 if(!file)return;let o;try{o=JSON.parse(await file.text())}catch(e){toast('백업 파일을 읽지 못했습니다. JSON 파일인지 확인하세요.');return}
 const ev=Array.isArray(o)?o:o?.events;
 if(!validEvents(ev)){toast('일정 데이터가 없는 파일입니다. 백업 파일을 다시 선택하세요.');return}
 if(!confirm('지금 저장된 내용을 백업 파일 내용으로 바꿀까요?'))return;
 events=ev.map(normEvent);store.set(KEY.events,events);
 if(!Array.isArray(o)){regions=cleanRegions(o.regions);store.set(KEY.regions,regions);if(Array.isArray(o.checks)){checks=cleanChecks(o.checks);store.set(KEY.checks,checks)}if(typeof o.memo==='string'){memo=o.memo;store.setRaw(KEY.memo,memo)}if(Array.isArray(o.expenses)){expenses=o.expenses;store.set(KEY.exp,expenses)}}
 render();toast('백업을 불러왔습니다.');
}

/* ---------- Editor ---------- */
function openEditor(id){
 const x=id?events.find(e=>e.id===id):null;S.editing=x?.id||null;
 $('#eT').textContent=x?'일정 수정':'일정 추가';$('#fDay').value=x?x.day:S.day;$('#fCat').value=x?.cat||'spot';$('#fTime').value=x?.time||'';$('#fName').value=x?.name||'';$('#fNote').value=x?.note||'';$('#fMap').value=x?.map||'';$('#fErr').textContent='';$('#fDel').hidden=!x;
 openDlg($('#editDlg'));
}
function saveEvents(){return store.set(KEY.events,events)}
$('#fDay').innerHTML=dates.map((d,i)=>`<option value="${i}">${d[0]} (${d[1]})</option>`).join('');
$('#editForm').addEventListener('submit',e=>{
 e.preventDefault();const name=$('#fName').value.trim();if(!name){$('#fErr').textContent='장소 이름을 입력하세요.';$('#fName').focus();return}
 const o={day:+$('#fDay').value,cat:$('#fCat').value,time:$('#fTime').value.trim(),name,note:$('#fNote').value.trim(),map:$('#fMap').value.trim()};
 const was=S.editing?events.find(x=>x.id===S.editing):null;
 if(was)Object.assign(was,o);else events.push({id:'custom'+Date.now(),...o});
 saveEvents();S.day=o.day;$('#editDlg').close();render();toast(was?'일정을 수정했습니다.':'일정을 추가했습니다.');
});

/* ---------- Actions ---------- */
const ACT={
 go:d=>go(d.p),day(d){S.day=+d.i;if(S.page==='home'||S.page==='schedule')render();else go('schedule')},
 cat(d){S.cat=d.c;render()},
 region(d){S.day=REGION_FIRST_DAY[d.k];go('schedule')},
 guide:d=>openGuide(d.id),edit:d=>openEditor(d.id),
 closeDlg:(d,el)=>el.closest('dialog').close(),
 delEvent(){const i=events.findIndex(x=>x.id===S.editing);if(i<0)return;const[x]=events.splice(i,1);saveEvents();$('#editDlg').close();render();toast(`'${x.name}' 일정을 삭제했습니다.`,()=>{events.splice(i,0,x);saveEvents();render()})},
 placeRegion(d){S.placeRegion=d.k;render()},foodRegion(d){S.foodRegion=d.k;render()},mapCat(d){S.mapCat=d.c;render()},
 phrase(d){const[k,v]=PHRASES[+d.i];$('#pV').textContent=v;$('#pK').textContent=k;openDlg($('#phraseDlg'))},
 delCheck(d){const i=+d.i,[c]=checks.splice(i,1);store.set(KEY.checks,checks);render();toast(`'${c.t}' 항목을 삭제했습니다.`,()=>{checks.splice(i,0,c);store.set(KEY.checks,checks);render()})},
 delExp(d){const i=expenses.findIndex(e=>e.id===d.id);if(i<0)return;const[x]=expenses.splice(i,1);store.set(KEY.exp,expenses);render();toast('기록을 삭제했습니다.',()=>{expenses.splice(i,0,x);store.set(KEY.exp,expenses);render()})},
 async liveRate(){try{const r=await fetch('https://open.er-api.com/v6/latest/KRW');const j=await r.json();const v=j?.rates?.VND;if(!v)throw 0;rate={v:Math.round(v*100)/100,src:`${new Date().toLocaleDateString('ko-KR')} 인터넷 환율`};store.set(KEY.rate,rate);render();toast('환율을 갱신했습니다.')}catch(e){toast('환율을 불러오지 못했습니다. 직접 입력해 주세요.')}},
 pick(d){S.pendingRegion=d.k;$('#regionFile').click()},
 resetPhoto(d){delete regions[d.k];store.set(KEY.regions,regions);render()},
 backup(){download({version:2,events,regions,checks,memo,expenses},'베트남여행_전체백업.json');toast('전체 백업을 저장했습니다.')},
 backupEvents(){download(events,'베트남여행_일정백업.json');toast('일정을 저장했습니다.')},
 restore(){$('#restoreFile').click()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el){const f=ACT[el.dataset.act];if(f){if(el.tagName==='BUTTON'&&el.type==='submit')e.preventDefault();f(el.dataset,el)}}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.check!=null){checks[+t.dataset.check].done=t.checked;store.set(KEY.checks,checks);const k=window.scrollY;render();window.scrollTo(0,k)}
 else if(t.id==='foodDay'){S.foodDay=t.value;render();$('#foodDay').focus()}
 else if(t.id==='regionFile'){pickRegionFile(t.files[0]);t.value=''}
 else if(t.id==='restoreFile'){restore(t.files[0]);t.value=''}
});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='memoBox'){memo=t.value;store.setRaw(KEY.memo,memo)}
 else if(t.id==='cVnd')$('#cKrw').value=Math.round((+t.value||0)/rate.v);
 else if(t.id==='cKrw')$('#cVnd').value=Math.round((+t.value||0)*rate.v);
 else if(t.id==='cRate'){const v=+t.value;if(v>0){rate={v,src:'직접 입력한 환율'};store.set(KEY.rate,rate);$('#rateSrc').textContent='직접 입력한 환율. 실제 환전 환율은 다릅니다.';$('#cKrw').value=Math.round((+$('#cVnd').value||0)/v)}}
});
document.addEventListener('submit',e=>{const t=e.target;
 if(t.id==='checkForm'){e.preventDefault();const v=$('#checkInput').value.trim();if(!v)return;checks.push({t:v,done:false});store.set(KEY.checks,checks);render();$('#checkInput').focus()}
 else if(t.id==='expForm'){e.preventDefault();const title=$('#xTitle').value.trim(),vnd=+$('#xVnd').value;if(!title||!(vnd>0)){toast('내용과 금액을 입력하세요.');return}expenses.push({id:'x'+Date.now(),day:+$('#xDay').value,title,vnd});store.set(KEY.exp,expenses);render()}
});

/* ---------- Start ---------- */
go(location.hash.slice(1)||'home',{silent:true});refreshWx();
if('serviceWorker'in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
